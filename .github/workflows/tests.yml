# dot_local/lib/homelab_agent/ dispatches production deployments to the
# homelab and handles 1Password Connect credentials. Its ~165 unit tests are
# the only guardrail on that behavior, so they run on every push and pull
# request instead of relying on someone to remember `python3 -m unittest`.
name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run homelab_agent test suite
        run: python3 -m unittest discover -s tests -v
