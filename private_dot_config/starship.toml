format = "$directory$git_branch$git_status$character"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = " [$branch]($style) "
style = "bold cyan"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Disable language modules we don't want in the prompt
[nodejs]
disabled = true

[python]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[kubernetes]
disabled = true
